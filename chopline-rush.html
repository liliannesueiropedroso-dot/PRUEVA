    <script>
      // Before first paint: the language and direction from the URL prefix, then the query's `lang`, then the
      // NEXT_LOCALE cookie, then the browser (src/i18n.tsx confirms it), and the Appearance choice next-themes stores
      // ("theme", dark by default).
      (() => {
        const prefixes = {"en":["en","ltr"],"fr":["fr","ltr"],"de":["de","ltr"],"ja":["ja","ltr"],"ko":["ko","ltr"],"es":["es","ltr"],"pt-br":["pt-BR","ltr"],"id":["id","ltr"],"zh-hant":["zh-Hant","ltr"],"zh-hans":["zh-Hans","ltr"],"it":["it","ltr"],"pl":["pl","ltr"],"nl":["nl","ltr"],"sv":["sv","ltr"],"nb":["nb","ltr"],"fi":["fi","ltr"],"tr":["tr","ltr"],"th":["th","ltr"],"vi":["vi","ltr"],"ar":["ar","rtl"]};
        const root = document.documentElement;
        const byLocale = Object.fromEntries(Object.values(prefixes).map((entry) => [entry[0], entry]));
        const cookie = /(?:^|;\s*)NEXT_LOCALE=([^;]+)/.exec(document.cookie);
        const language = (navigator.language || "en").toLowerCase();
        const entry = prefixes[location.pathname.split("/")[1]] || byLocale[new URLSearchParams(location.search).get("lang")]
          || (cookie && byLocale[decodeURIComponent(cookie[1])])
          || Object.values(prefixes).find((candidate) => candidate[0].toLowerCase() === language)
          || prefixes[language.split("-")[0]] || prefixes.en;
        root.lang = entry[0];
        root.dir = entry[1];
        let theme = "dark";
        try { theme = localStorage.getItem("theme") || "dark"; } catch (error) {}
        if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        root.classList.add(theme === "light" ? "light" : "dark");
        root.style.colorScheme = theme === "light" ? "light" : "dark";
      })();
    </script>

    <script>
      // The install prompt fires before the app loads (copied from apps/web/app/web-internal/[lang]/layout.tsx).
      (() => {
        if (window.__playdropPwaCaptureInstalled) return;
        window.__playdropPwaCaptureInstalled = true;
        window.__playdropDeferredInstallPrompt = window.__playdropDeferredInstallPrompt ?? null;
        window.__playdropInstallPromptAvailable = window.__playdropInstallPromptAvailable ?? false;
        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          window.__playdropDeferredInstallPrompt = event;
          window.__playdropInstallPromptAvailable = true;
        });
        window.addEventListener("appinstalled", () => {
          window.__playdropDeferredInstallPrompt = null;
          window.__playdropInstallPromptAvailable = false;
        });
      })();
      // A script or stylesheet of the app that fails to load turns the launch state into Retry (a reload the user asks for).
      window.addEventListener("error", (event) => {
        const target = event.target;
        const url = target && (target.src || target.href);
        const shell = document.getElementById("app-shell");
        if (url && url.includes("/_next/static/player/") && shell && shell.dataset.appState !== "ready") shell.dataset.appState = "retry";
      }, true);
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; }
      #launch { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #app-shell[data-app-state="ready"] #launch { display: none; }
      /* An account change or an update covers the app until the reload: nothing of the old account stays visible. */
      #app-shell:not([data-app-state="ready"]) > #root { visibility: hidden; }
      #app-shell[data-app-state="update"] #launch { z-index: 200; }
      #launch [data-launch-panel] { display: none; }
      #app-shell[data-app-state="launching"] [data-launch-panel="launching"],
      #app-shell[data-app-state="retry"] [data-launch-panel="retry"],
      #app-shell[data-app-state="update"] [data-launch-panel="update"],
      #app-shell[data-app-state="sign-in"] [data-launch-panel="sign-in"] { display: flex; }
      /* From a list to a game (platform Link runs the browser's view transition through the router): the card art the
         tap left from and the game's hero share one name, so the art grows into the hero while the rest cross-fades.
         The hero is a listing's stage, or an instant game's settled card in the feed; before the detail arrives the
         route paints the same hero from the list's card (routes/game-placeholder.tsx). Reduce Motion keeps the
         navigation and drops the animation. */
      :root:active-view-transition img[data-view-transition-source],
      :root:active-view-transition [data-screen="game"] .regular-game-stage,
      :root:active-view-transition [data-screen="game"] .instant-feed-page:not([aria-hidden]) .instant-mode-card { view-transition-name: game-hero; }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
      }

    <script>
      // Until the app has loaded, Retry reloads; the app replaces it with a new launch that keeps the page.
      document.addEventListener("click", (event) => {
        const action = event.target instanceof Element && event.target.closest("[data-launch-action]");
        if (!action) return;
        if (action.dataset.launchAction === "retry" && window.__playdropRelaunch) window.__playdropRelaunch();
        else location.reload();
      });
    </script>
